<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,'Noto Sans TC',sans-serif">
  <title>mac-video-transfer — 系統架構</title>
  <desc>Electron 桌面應用架構圖：使用者介面層、IPC 橋接層、Electron 主行程、本機處理引擎、本機檔案系統。無雲端／無後端服務。Keystone：全本機處理，影片不上傳雲端。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E4B8F"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7178"/>
    </marker>
    <marker id="arrowErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="1080" fill="#FBFAF7"/>

  <!-- header -->
  <text x="60" y="52" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="26" fill="#181B20">Video Compressor<tspan fill="#2E4B8F">.</tspan></text>
  <text x="60" y="76" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,monospace" font-size="11" letter-spacing="1.5" fill="#6B7178">SYSTEM ARCHITECTURE — mac-video-transfer（原生 Electron 桌面版）</text>
  <line x1="60" y1="92" x2="940" y2="92" stroke="#E7E3DA" stroke-width="1"/>

  <!-- ===== main column boxes ===== -->

  <!-- L1 UI -->
  <rect x="60" y="130" width="620" height="140" rx="9" fill="#FBFAF7" stroke="#E7E3DA" stroke-width="1.4"/>
  <text x="80" y="156" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" fill="#6B7178">① 使用者介面層 — ELECTRON RENDERER PROCESS</text>
  <text x="80" y="184" font-size="14" fill="#181B20" font-weight="600">index.html + styles.css + renderer.js</text>
  <text x="80" y="206" font-size="12.5" fill="#181B20">單頁四態：空狀態(拖放/選檔) → 待處理清單 → 轉檔進度 → 完成結果</text>
  <text x="80" y="228" font-size="12.5" fill="#181B20">側邊欄常駐：輸出格式／編碼器／品質／音訊／解析度／目標大小／快速預設</text>
  <text x="80" y="252" font-size="11.5" fill="#6B7178">✓ 已讀原始碼確認</text>

  <!-- L2 preload -->
  <rect x="60" y="300" width="620" height="110" rx="9" fill="#FBFAF7" stroke="#E7E3DA" stroke-width="1.4"/>
  <text x="80" y="326" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" fill="#6B7178">② IPC 橋接層 — PRELOAD.JS</text>
  <text x="80" y="354" font-size="14" fill="#181B20" font-weight="600">contextBridge.exposeInMainWorld('api', {...})</text>
  <text x="80" y="376" font-size="12.5" fill="#181B20">contextIsolation:true／nodeIntegration:false（安全通道，不暴露完整 ipcRenderer）</text>
  <text x="80" y="397" font-size="11.5" fill="#6B7178">✓ 已讀原始碼確認</text>

  <!-- L3 main process -->
  <rect x="60" y="440" width="620" height="140" rx="9" fill="#FBFAF7" stroke="#2E4B8F" stroke-width="1.6"/>
  <text x="80" y="466" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" fill="#6B7178">③ ELECTRON 主行程 — MAIN.JS</text>
  <text x="80" y="494" font-size="14" fill="#181B20" font-weight="600">ipcMain.handle：對話框／get-video-info／convert-video／cancel</text>
  <text x="80" y="516" font-size="12.5" fill="#181B20">BrowserWindow 生命週期管理、進度事件透過 webContents.send 推回 UI</text>
  <text x="80" y="538" font-size="12.5" fill="#181B20">show-in-folder／open-file（呼叫系統 shell）</text>
  <text x="80" y="562" font-size="11.5" fill="#6B7178">✓ 已讀原始碼確認</text>

  <!-- L4 local engine -->
  <rect x="60" y="610" width="620" height="140" rx="9" fill="#FBFAF7" stroke="#2E4B8F" stroke-width="1.6"/>
  <text x="80" y="636" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" fill="#6B7178">④ 本機處理引擎</text>
  <text x="80" y="664" font-size="14" fill="#181B20" font-weight="600">fluent-ffmpeg → ffmpeg-static／ffprobe-static（子行程）</text>
  <text x="80" y="686" font-size="12.5" fill="#181B20">編碼器：H.265/H.264 硬體加速(VideoToolbox)、H.265/H.264 軟體、VP9</text>
  <text x="80" y="708" font-size="12.5" fill="#B8860B">▸ 打包後路徑修正：app.asar → app.asar.unpacked（commit 9866ac1，僅開發模式已驗證）</text>
  <text x="80" y="732" font-size="11.5" fill="#6B7178">✓ 已讀原始碼確認</text>

  <!-- L5 filesystem -->
  <rect x="60" y="780" width="620" height="120" rx="9" fill="#FBFAF7" stroke="#2E4B8F" stroke-width="1.6"/>
  <text x="80" y="806" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" fill="#6B7178">⑤ 本機檔案系統</text>
  <text x="80" y="834" font-size="14" fill="#181B20" font-weight="600">使用者 Mac 磁碟：輸入影片檔 → 輸出影片檔（MP4／WebM）</text>
  <text x="80" y="856" font-size="12.5" fill="#181B20">無資料庫、無帳號、無雲端儲存</text>
  <text x="80" y="880" font-size="11.5" fill="#6B7178">✓ 已讀原始碼確認</text>

  <!-- vertical flow arrows -->
  <line x1="370" y1="270" x2="370" y2="298" stroke="#2E4B8F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="410" x2="370" y2="438" stroke="#2E4B8F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="580" x2="370" y2="608" stroke="#2E4B8F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="750" x2="370" y2="778" stroke="#2E4B8F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <text x="386" y="290" font-size="11" fill="#6B7178">window.api.*() 呼叫</text>
  <text x="386" y="430" font-size="11" fill="#6B7178">ipcRenderer.invoke(channel,…)</text>
  <text x="386" y="600" font-size="11" fill="#6B7178">spawn 子行程執行</text>
  <text x="386" y="770" font-size="11" fill="#6B7178">讀取／寫入檔案</text>

  <!-- progress event back to UI (dashed curve on far left) -->
  <path d="M 50 500 C -10 500, -10 200, 50 200" fill="none" stroke="#6B7178" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowMuted)" transform="translate(20,0)"/>
  <text x="15" y="350" font-size="11" fill="#6B7178" transform="rotate(-90 15 350)">conversion-progress 事件推回 UI</text>

  <!-- ===== absent cloud layer (top right) ===== -->
  <rect x="740" y="130" width="200" height="140" rx="9" fill="#FBFAF7" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="760" y="158" font-size="20" fill="#B03A2E">✗</text>
  <text x="785" y="158" font-size="12.5" fill="#B03A2E" font-weight="600">雲端 API／上傳伺服器</text>
  <text x="760" y="182" font-size="12" fill="#B03A2E">帳號系統／遙測</text>
  <text x="760" y="206" font-size="12" fill="#6B7178">本工具程式碼中不存在</text>
  <text x="760" y="226" font-size="12" fill="#6B7178">此層，「未確認」有規劃</text>
  <text x="760" y="248" font-size="12" fill="#6B7178">要新增此層。</text>
  <line x1="680" y1="200" x2="738" y2="200" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrowErr)"/>
  <text x="686" y="192" font-size="10.5" fill="#B03A2E">不會發生的呼叫</text>

  <!-- ===== keystone box (right, spans L3-L5) ===== -->
  <rect x="740" y="440" width="200" height="460" rx="10" fill="#EAEEF7" stroke="#2E4B8F" stroke-width="2.4"/>
  <text x="760" y="472" font-size="22" fill="#2E4B8F">🔒</text>
  <text x="760" y="500" font-size="13.5" fill="#181B20" font-weight="700">Keystone 設計決定</text>
  <text x="760" y="524" font-size="12.5" fill="#181B20" font-weight="600">全本機處理</text>
  <text x="760" y="550" font-size="12" fill="#181B20">影片檔案「不曾離開</text>
  <text x="760" y="568" font-size="12" fill="#181B20">這台 Mac」</text>

  <text x="760" y="600" font-size="12" fill="#181B20">・無網路呼叫</text>
  <text x="760" y="622" font-size="12" fill="#181B20">・無雲端上傳</text>
  <text x="760" y="644" font-size="12" fill="#181B20">・無帳號系統</text>
  <text x="760" y="666" font-size="12" fill="#181B20">・無遙測回傳</text>

  <line x1="760" y1="690" x2="920" y2="690" stroke="#2E4B8F" stroke-width="1"/>

  <text x="760" y="714" font-size="11.5" fill="#6B7178">→ 大檔案、隱私敏感</text>
  <text x="760" y="734" font-size="11.5" fill="#6B7178">影片可安心處理</text>
  <text x="760" y="756" font-size="11.5" fill="#6B7178">→ 離線可用，速度</text>
  <text x="760" y="776" font-size="11.5" fill="#6B7178">取決於本機硬體</text>
  <text x="760" y="798" font-size="11.5" fill="#6B7178">（VideoToolbox）</text>

  <text x="760" y="828" font-size="11" fill="#B8860B">▸ 對比：多數線上壓縮</text>
  <text x="760" y="846" font-size="11" fill="#B8860B">工具需上傳影片至伺服器</text>

  <!-- bracket lines connecting L3/L4/L5 to keystone box -->
  <line x1="680" y1="510" x2="738" y2="560" stroke="#2E4B8F" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="680" y1="680" x2="738" y2="660" stroke="#2E4B8F" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="680" y1="840" x2="738" y2="760" stroke="#2E4B8F" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- legend -->
  <line x1="60" y1="940" x2="940" y2="940" stroke="#E7E3DA" stroke-width="1"/>
  <text x="60" y="964" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" fill="#6B7178">LEGEND</text>
  <text x="60" y="988" font-size="12" fill="#181B20">✓ 已讀原始碼確認的元件　　▸ 已知風險／進行中細節　　✗ 不存在／未規劃的層　　🔒 Keystone 關鍵設計決定</text>
  <text x="60" y="1010" font-size="11.5" fill="#6B7178">來源：main.js／preload.js／renderer.js／index.html／HANDOFF.md／AGENTS.md／README.md／git log（2026-07-24 讀取）</text>
  <text x="60" y="1032" font-size="11.5" fill="#6B7178">本圖依 mac-video-transfer 實際程式碼繪製；姊妹專案 mac-video-transfer-web（若存在雲端/Web 版）不在此圖範圍內。</text>

</svg>
